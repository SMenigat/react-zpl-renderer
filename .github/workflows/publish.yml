name: Publish to NPM

on:
  push:
    tags:
      - "*"
    branches:
      - main

jobs:
  publish:
    # Only run if the push is both a tag AND on the main branch
    if: startsWith(github.ref, 'refs/tags/') && github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build

      - name: Verify package contents
        run: |
          echo "Package contents:"
          ls -la dist/
          echo "Package.json version: $(node -p "require('./package.json').version")"
          echo "Git tag: ${{ github.ref_name }}"

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN_ZPL_RENDERER }}
